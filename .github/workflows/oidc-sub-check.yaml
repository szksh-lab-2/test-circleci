name: oidc-sub-check
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  show-sub:
    runs-on: ubuntu-latest
    steps:
      - name: Print selected OIDC claims
        run: |
          set -euo pipefail
          token=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "::add-mask::$token"
          payload=$(printf '%s' "$token" | cut -d. -f2 | tr '_-' '/+')
          pad=$(( (4 - ${#payload} % 4) % 4 ))
          payload="${payload}$(printf '=%.0s' $(seq 0 $pad) | cut -c1-$pad)"
          printf '%s' "$payload" | base64 -d \
            | jq '{sub, ref, job_workflow_ref, event_name, workflow_ref}'
